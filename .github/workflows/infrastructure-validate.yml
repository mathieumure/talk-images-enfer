name: Infrastructure Validate

on:
  pull_request:
    paths:
      - 'packages/infrastructure/**'
      - '.github/workflows/infrastructure-validate.yml'

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.6.0

      - name: Setup Terragrunt
        run: |
          TERRAGRUNT_VERSION=0.96.1
          wget -q https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terraform Format Check
        run: tofu fmt -check -recursive terraform/

      - name: Validate Terraform Modules
        run: |
          for module in terraform/modules/*; do
            echo "Validating $module..."
            (cd "$module" && tofu init -backend=false && tofu validate)
          done

      - name: Setup environment (for Terragrunt validation)
        run: |
          # Set dummy values for validation
          echo "SCALEWAY_ACCESS_KEY=dummy" >> $GITHUB_ENV
          echo "SCALEWAY_SECRET_KEY=dummy" >> $GITHUB_ENV
          echo "SCALEWAY_ORGANIZATION_ID=00000000-0000-0000-0000-000000000000" >> $GITHUB_ENV
          echo "SCALEWAY_PROJECT_ID=00000000-0000-0000-0000-000000000000" >> $GITHUB_ENV

      - name: Validate Terragrunt Configuration
        env:
          TERRAGRUNT_TFPATH: tofu
        run: |
          cd environments/production
          terragrunt run --all --non-interactive -- validate

      - name: Validation Success
        run: |
          echo "✅ All validation checks passed!"
