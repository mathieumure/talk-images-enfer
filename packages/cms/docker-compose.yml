version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: strapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U strapi']
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strapi-cms
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-strapi}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      NODE_ENV: ${NODE_ENV:-development}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://localstack:4566}
      AWS_BUCKET: ${AWS_BUCKET:-strapi-assets}
      AWS_FORCE_PATH_STYLE: ${AWS_FORCE_PATH_STYLE:-true}
    ports:
      - '1337:1337'
    volumes:
      - ./config:/app/config
      - ./src:/app/src
      - ./public/uploads:/app/public/uploads
      - ./database:/app/database
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  localstack:
    image: localstack/localstack:4.12.0
    container_name: strapi-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEBUG: 0
      PERSISTENCE: 1
    ports:
      - '4566:4566'
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 5

  imgproxy:
    image: darthsim/imgproxy:v3.30.0
    container_name: strapi-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_ENABLE_WEBP_DETECTION: 'true'
      IMGPROXY_ENFORCE_WEBP: 'false'
      IMGPROXY_QUALITY: 85
      IMGPROXY_GZIP_COMPRESSION: 5
      IMGPROXY_MAX_SRC_RESOLUTION: 50
      IMGPROXY_ALLOW_LOOPBACK_SOURCE_ADDRESSES: 'true'
    extra_hosts:
      - "localhost:host-gateway"
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'imgproxy', 'health']
      interval: 10s
      timeout: 5s
      retries: 3

  varnish:
    image: varnish:7.7.3
    container_name: strapi-varnish-cache
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./default.vcl:/etc/varnish/default.vcl:ro
    environment:
      VARNISH_SIZE: 512M
    command: ['-p', 'default_ttl=86400', '-p', 'default_grace=3600']
    depends_on:
      - imgproxy
    tmpfs:
      - /var/lib/varnish:exec,mode=1777

volumes:
  postgres-data:
  localstack-data:
